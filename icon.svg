<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagonal Tactical Ring -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#primaryGrad)" stroke-width="2.5" fill="#0C0D14" />
  
  <!-- Subtle Internal Grid -->
  <polygon points="50,16 80,33 80,67 50,84 20,67 20,33" stroke="#252A40" stroke-width="1.2" stroke-dasharray="3 3" fill="none" />
  
  <!-- The Regulus Star Core (4-Point Diamond Flare) -->
  <path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Central Pulse Ring -->
  <circle cx="50" cy="50" r="9" fill="#090A10" stroke="#00F0FF" stroke-width="2" />
  <circle cx="50" cy="50" r="4" fill="#00F0FF" />
  
  <!-- Orbital Launcher Beams -->
  <circle cx="50" cy="6" r="3" fill="#00F0FF" />
  <circle cx="88" cy="28" r="3" fill="#7000FF" />
  <circle cx="88" cy="72" r="3" fill="#FF007A" />
  <circle cx="50" cy="94" r="3" fill="#00F0FF" />
  <circle cx="12" cy="72" r="3" fill="#7000FF" />
  <circle cx="12" cy="28" r="3" fill="#00F0FF" />
</svg>
